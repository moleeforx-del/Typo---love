\",\"content\":\"1200\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image:type\",\"content\":\"image/png\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:title\",\"content\":\"typo.love — a digital library of love letters\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:description\",\"content\":\"for all the words left unsaid. a project by @lychkel\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:image\",\"content\":\"https://www.typo.love/opengraph-image.png?opengraph-image.c4959571.png\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:image:type\",\"content\":\"image/png\"}],[\"$\",\"link\",\"15\",{\"rel\":\"icon\",\"href\":\"/icon.png?icon.57db27ed.png\",\"sizes\":\"512x512\",\"type\":\"image/png\"}],[\"$\",\"$L10\",\"16\",{}]]\n"])</script><script>self.__next_f.push([1,"11:I[57577,[\"/_next/static/chunks/9c152453eabc6e48.js\",\"/_next/static/chunks/dfd98513be7e436a.js\",\"/_next/static/chunks/b6071be0e0398e05.js\",\"/_next/static/chunks/7fbff105c0a5b464.js\"],\"default\"]\n12:T4fc,Dear Lunae, \n\n(this is how I will refer to you in this letter, I hope you don’t mind)\n\nThank you for being my first love. This is something that I do not have the courage to tell you. This is something that has been on my mind.\n\nYou showed me so much about myself when it comes to love when we were together. How I’d always write poems for you, how you inspired me to such heights. How I’d see this new side of you, such a romantic, how you admired every part of me. I wonder if you still do.\n\nYou said that love is transcendent, and that is true.\n\nYou said that my love is overwhelming, and that is also true.\n\nAnd I’d like to thank you for teaching that to me. I wish I could say it without it feeling awkward, but I still love you. Just in a different form now. I still love you. \n\nI’ve been reflecting on myself in this transition, in this moment. We’re both in such different paths of life, that even if it did work out, a lot of my faults would’ve shown. And I have a lot of growing to do. I really do.\n \nI do care a lot about you. I am wishing you well in everything that you do.\n\nThank you, again. We’ll be OK.\n\nLove, Solis\n\nP.S: If you ever do find this, I have two things to say. I’m sorry. And that everything will become beautiful again in time. 13:T442,—,\n\ni hate how popular sabrina carpenter is because everytime i hear please please please my heart sinks to my stomach. you don't know this, but i played this song on loop during hot summer days spent in an empty apartment with a broken AC. it quickly became my anthem to our breakup. \n\nthese days I've been replaying the last moments I saw you, how our goodbyes felt hesitant, how ~I wished you kissed me then~ we tried to hug out the awkwardness regardless.\n\ni know you had your reasons for leaving, and i'm not interested in being with someone who chose to leave me. but that doesn't mean i'll stop missing or loving you. i don't think i ever told you i loved you, even. still, i hope you felt it. \n\nyou know how prideful i am, so I hate to admit the grip you have on me, even now. it feels kind of silly honestly, so please ignore this if you're seeing someone new now. a part of me hopes you never see this and a part of me hopes you do.\n\n...you think we could still be homies?\n\nearnestly,\nclementine\n\np.s.  it'd be nice to see you again when i visit, at the place where we first met14:T5fb,"])</script><script>self.__next_f.push([1,"Dear you,\n\nI just wanted to say thank you for being a part of my life. We met in Grade 11 when you transferred in, barely knowing anyone. We started talking because we had a few classes together and were both in the tech crew. We’d always go back and forth with our usual friendly banter, making it seem like we couldn’t stand each other, but those moments always stuck with me.\n\nThanks for helping me with my CS homework and for always letting me bother you—especially when I needed to vent. Over the years, we drifted apart and reconnected more than once, but somehow, we always found our way back to hanging out. Some of my favourite memories are from our late-night drives, blasting music, and all the random places we went to.\n\nOne moment that still stands out was when we went to that concert for my favourite artist. I couldn’t decide between a t-shirt or a sweater, and you just went ahead and got me the sweater. It’s still one of my favourites to this day.\n\nI know you always saw me as a younger sister, and I was okay with that. But somewhere along the way, I started to see you differently. When you got a girlfriend, I was happy for you, but I also knew it meant we wouldn’t be hanging out as much. And when you told me you were leaving, it really hit me how much I was going to miss you.\n\nEven though life has taken us in different directions, I’ll always appreciate the time we spent together. Hopefully, one day, we’ll get to catch up again, even just as friends.\n\nWishing you all the best.\n\nLove, T"])</script><script>self.__next_f.push([1,"15:T420,Dear X,\n\nAlmost ten years ago, I bought a train ticket to your town just to see you. I was so in love. I thought you were my whole world. Years passed, and I remember believing I loved you, then believing I hated you. And then the war started, and I forgot about everything.\n\nSometimes, I wondered how you were. How was your mother? Was your black cat—whose name I’ve forgotten—still with you? I remember sending you a letter once, with a quote from Jane Eyre:\n\n\"I am no bird; and no net ensnares me; I am a free human being with an independent will.\"\n\nYou probably never even read it.\n\nNow, I find myself thinking that I hurt you more than you hurt me. What we had wasn’t love—we wounded each other, desperately, painfully. But I know I was cruel.\n\nYears have passed, and you haven't changed. You never left your town. I saw you. You are exactly the same. I thought you were dead to me, but when I saw you, I realized that the girl who once loved you so desperately no longer exists.\n\nYou were dead to me, but in reality, I was the one who died.16:T77b,"])</script><script>self.__next_f.push([1,"Dear Lici,\n\nI don't think anyone deserves a hug right now more than you do. \n\nIt's so weird and new how familiar you've gotten with the concept of loneliness. It has always been a foreign concept but now it's staring at you in the mirror.\nIt fills your mind, it eats your soul away, and it keeps dragging you down.\n\nYou know all the things you'd tell another, as to how to get out of this rut. But you also know it's a temporary fix. It's a cycle you keep coming back to and it hurts each time.\n\nI know you crave love. \nI know you crave a companion. You want someone to stand by your side. You want someone who helps you escape the loneliness. I know you do. I truly know you do but I also know you only deserve the best.\n\nI love you so much. \nYou are beautiful. You are sweet. You are kind. You are caring. I see how you think of everyone even when you are not in contact with them. You love people and want people to love you back, the way you do, if not harder. That shows how great of a person you are. Highly considerate and tender. \n\nYou don't deserve any less than the best and I need you to be patient. It's so hard, but I need you to be patient. The best person, the best people will come. You will be so immersed in love, you can barely escape it. \n\nCan you hold on to that future?\nCan you stand strong till we get there?\nCan you ensure you don't give in to loneliness?\nCan you wait just a bit more?\n\nLet's find other ways to escape the loneliness. Let's find other ways to enjoy being who we are and where we are. I don't know how but you are smart, you'd figure something out.\n\nI love you so so much and I can't wait for when you find the one that sweeps you off your feet, gives you flowers because they remind him of you, gives you the princess twirl because you are a princess, and makes you feel his love without a doubt in your mind.\n\nLet's be patient just as love is patient.\n\nWith All Love,\nLici."])</script><script>self.__next_f.push([1,"17:T727,"])</script><script>self.__next_f.push([1,"Dear Future Mother-in-law,\n\nIt's a bit of an odd letter, I don't even have a loml yet, and even that's not guaranteed.\nBut if I am lucky, I hope when I meet your very emotionally secure, deeply intelligent and handsome son, that I get to spend time with the woman that raised him as such.\n\nSo, could you show me how to make his favourite dish the way you do? We’ll cook together. I hope by the time we meet I’m better at it though. The other night, I facetimed my friends asking them to show me how to cook chicken for the first time. They were also largely appalled at my inability to cut vegetables correctly. I believe the only reason I haven’t cut my fingers is because my knives aren’t sharp enough.\n\nAlso could you show me his baby pictures? I know you love to talk about your family history. At the moment, I love sharing pictures of my younger sister. Often my friends show me pictures of their pets, I find it quite funny to show them pictures of a whole human being in return.\n\nActually, could you accompany me for some shopping? We are buying furniture for our new place. Right now I can’t even imagine having the money for that! It’ll be fun, and of course we can have a nice tea whilst out if you fancy.\n\n…\n……\n………\n\nWould you be able to tell I’m using him as an excuse? I figured mum’s are supposed to have an intuition for how their children really feel. \n\nIn which case, could we drop the in-law and can I just be a daughter?\n\n...\n\nThere's much more to say, but it's almost 4am and I'm tired. Until next time!!\n\nFrom your future daughter(-in-law)\n\nP.S. [Good Morning Call, S1.11, 32:10] [It’s Okay To Not Be Okay, S1.15, 57:54] [Crash Course In Romance, S1.2, 10.31] [Tangled, 1:28:53] [Mamma Mia, 1:19:00] [The Witcher, S2.3, 36:10] [Supergirl, S1.3, 7:00] [Modern Family, S5.12, 20:10]"])</script><script>self.__next_f.push([1,"18:T659,"])</script><script>self.__next_f.push([1,"Dear B,\n\nHow are you doing? I hope you're doing well. I miss how much we used to talk, and maybe, in my heart, I always kind of knew that this friendship might not last...\n\nI know we're still friends but maybe not as close as before but  that’s okay. I miss you you know? Some days, I see things that remind me of you—the very quality I love about myself causes me to miss you dearly.\n\nI really appreciate your encouragement this year, I truly do. I know you value authenticity a lot, but I still can’t help but wonder if the encouragement was fake. When I try to see myself through someone else’s eyes, I can’t help but think I look pathetic... the way I just keep waiting and waiting for you to reach back.\n\nWe’re still friends, but now our talks and chats make me feel more anxious and want to cry. It’s like waiting for a string to break. I haven’t told you any of this yet. Sometimes, I think being the oldest really makes being vulnerable hard...\n\nWe agreed to be honest, but I don’t know how to tell you that you make me feel like I matter less—that maybe I’m broken and worthless. And oh, how I wish you used more stickers and checked in more... Maybe the things that matter less to you really matter more to me.\n\nBut even so, I still can’t help but wish you're doing well and that you're truly happy.\n\nI still value our connection. There’s a lot left for me to learn in this world. Thank you for being a stepping stone and helping me get started.\n\nP.S: If you ever do find this, maybe reach back out to me. Maybe by then, I’ll have enough courage to tell you that it was me.\n\nLove,\n K🍓"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L11\",null,{\"letters\":[{\"id\":\"01\",\"slug\":\"dreamland\",\"title\":\"dreamland\",\"author\":\"9\",\"recipient\":\"7\",\"body\":\"to 7, \\n\\ni have a recurring dream that we're visiting you. every time, i come with different people. and every time, i don't know how we got up there. we're just there. it's empty at first, and then you appear. i bring your favourite cookies, we walk around and talk about what has changed. but i always wake up, i'm hundreds of kilometres away, and even if we went to where we remember you, i don't even know if you'd be there.\\n\\n9\",\"audio_url\":\"./assets/love-songs/In%20Dreamland%20Background%20Music.mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-02-08T18:04:07+00:00\",\"cover_image\":\"./assets/envelopes/01.avif\",\"background_image\":\"./assets/backgrounds/01-dreamcloud.png\",\"polaroid_image\":\"./assets/polaroid-images/01.png\",\"song_name\":\"in dreamland...\",\"accent_color\":\"#315FAD\",\"text_color\":null,\"frosted_fill_color\":null,\"volume\":1},{\"id\":\"02\",\"slug\":\"the-stars-and-the-moon\",\"title\":\"the stars and the moon\",\"author\":\"Solis\",\"recipient\":\"Lunae\",\"body\":\"$12\",\"audio_url\":\"./assets/love-songs/Night%20Ambience%20Sound%20Effect.mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-02-14T21:04:33+00:00\",\"cover_image\":\"./assets/envelopes/02.avif\",\"background_image\":\"./assets/backgrounds/02-real.png\",\"polaroid_image\":\"./assets/polaroid-images/02.png\",\"song_name\":\"cricket...cricket...cricket...\",\"accent_color\":\"#302A6C\",\"text_color\":\"#fff\",\"frosted_fill_color\":\"#302A6C75\",\"volume\":1},{\"id\":\"03\",\"slug\":\"heatwaves\",\"title\":\"heatwaves\",\"author\":\"clementine\",\"recipient\":\"—\",\"body\":\"$13\",\"audio_url\":\"./assets/love-songs/Sabrina%20Carpenter%20Please%20Please%20Please%20Lyric%20Video%20(1).mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-02-08T18:33:17+00:00\", song_name\":\"keep smiling by demxntia\",\"accent_color\":\"#7D6DA2\",\"text_color\":\"#7D6DA2\",\"frosted_fill_color\":\"#FBEBFF\",\"volume\":1},{\"id\":\"06\",\"slug\":\"past-meets-present\",\"title\":\"past meets present\",\"author\":\"the present version of myself\",\"recipient\":\"S\",\"body\":\"Dear S,\\n\\nThere’s a version of myself that would run back to you. To feel your embrace once more. To brush my fingers through your hair. \\n\\nThe pain subsides every now and then but it comes back out in the quiet of the night. \\n\\nI wonder how you’ve been. \\n\\nI hope you’ve been well. \\n\\nSelfishly I hope you’ve been missing me too. \\n\\nThere’s a version of myself that would run back to you but that version now lives in the past.\\n\\nWith all my heart,\\nThe present version of myself \",\"audio_url\":\"./assets/love-songs/Calm%20Sea%20Waves.mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-02-13T17:41:55+00:00\",\"cover_image\":\"./assets/envelopes/06.avif\",\"background_image\":\"./assets/backgrounds/10.png\",\"polaroid_image\":\"./assets/polaroid-images/06.png\",\"song_name\":\"the sound of waves, washing over the memories...\",\"accent_color\":\"#D31617\",\"text_color\":\"#fff\",\"frosted_fill_color\":\"#D31617\",\"volume\":1},{\"id\":\"07\",\"slug\":\"for-the-mems\",\"title\":\"for the mems\",\"author\":\"T\",\"recipient\":\"you\",\"body\":\"$14\",\"audio_url\":\"./assets/love-songs/Beside%20You%20Lyric%20Video.mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-02-07T03:59:13+00:00\",\"cover_image\":\"./assets/envelopes/07.avif\",\"background_image\":\"./assets/backgrounds/07-real.png\",\"polaroid_image\":\"./assets/polaroid-images/07.png\",\"song_name\":\"beside you by keshi\",\"accent_color\":\"#2B2A55\",\"text_color\":\"#2B2A55\",\"frosted_fill_color\":\"#DEFBFF\",\"volume\":1},{\"id\":\"08\",\"slug\":\"twenty-mcnuggets\",\"title\":\"twenty mcnuggets\",\"author\":\"\u003c3\",\"recipient\":\"\",\"body\":\"hey,\\n\\ni wonder if we'll cross paths again. i wonder if we'll have a moment to sit down and catch up. will we want to catch up? will i want to catch up? i wonder what our futures will look like. will you change? i wonder if i will change by then too. \\n\\ni kinda miss having you around, despite everything...\\n\\nhugs, \u003c3\",\"audio_url\":\"./assets/love-songs/November%20Notes%20Lofi%20Beat.mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-02-13T03:43:15+00:00\",\"cover_image\":\"./assets/envelopes/08.avif\",\"background_image\":\"./assets/backgrounds/08-real.png\",\"polaroid_image\":\"./assets/polaroid-images/08.png\",\"song_name\":\"November Notes by SamOckTV\",\"accent_color\":\"#333A56\",\"text_color\":\"#333A56\",\"frosted_fill_color\":null,\"volume\":1},{\"id\":\"09\",\"slug\":\"best-friend\",\"title\":\"best friend\",\"author\":\"Zey\",\"recipient\":\"Hus\",\"body\":\"Dear Hus,\\n\\nI say it a lot, but I’ll say it once more—you make me feel at home, no matter where in the world we are. I hope you feel it in the way I reach for you every morning, in the way I laugh a little louder when you’re around.\\n\\nI love you, and I like you.\\n\\n-Zey\",\"audio_url\":\"./assets/love-songs/Lucky%20from%20YouTube%20to%20MP3.mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-02-10T13:14:39+00:00\",\"cover_image\":\"./assets/envelopes/09.avif\",\"background_image\":\"./assets/backgrounds/09-real.png\",\"polaroid_image\":\"./assets/polaroid-images/09.png\",\"song_name\":\"Lucky by Jason Mrax \u0026 Colbie Caillat\",\"accent_color\":\"#30A2FF\",\"text_color\":\"#30A2FF\",\"frosted_fill_color\":\"#E2F2FF\",\"volume\":1},{\"id\":\"10\",\"slug\":\"strawberry-matcha-memories\",\"title\":\"strawberry matcha memories\",\"author\":\"lemon\",\"recipient\":\"carmen\",\"body\":\"dear carmen, \\n\\nhappy valentines day :)\\n\\nit has been so fun spending this first part of 2025 with you in vancouver. thank you for taking me sledding in the snow and for crocheting a sea cucumber for me because I was so upset we couldn't ,{\"id\":\"13\",\"slug\":\"ghost\",\"title\":\"ghost\",\"author\":null,\"recipient\":\"X\",\"body\":\"$15\",\"audio_url\":\"./assets/love-songs/Both%20Sides%20Now.mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-02-14T18:37:12+00:00\",\"cover_image\":\"./assets/envelopes/13.avif\",\"background_image\":\"./assets/backgrounds/13-real.png\",\"polaroid_image\":\"./assets/polaroid-images/13.png\",\"song_name\":\"Both Sides Now by Joni Mitchell\",\"accent_color\":\"#404040\",\"text_color\":\"#404040\",\"frosted_fill_color\":\"#E2ECE2\",\"volume\":1},{\"id\":\"14\",\"slug\":\"used-to-know\",\"title\":\"used to know\",\"author\":\"xx\",\"recipient\":\"n\",\"body\":\"dearest n,\\n\\nif i had to pick one day to relive again, i'd pick any day i spent with you in a heartbeat. it doesn't matter that we don't speak anymore - i don't know what you're up to or where you are. i think about you every day. i hope you're doing well, i hope you find what you're looking for, and i hope you find so much love it makes you giddy.\\n\\ni know what it means to love someone because of you. you're the first person i ever loved. it hurts, but thank you. i don't think i'll stop loving you. i don't know how to. \\n\\nonce yours,\\nxx\",\"audio_url\":\"./assets/love-songs/Coldplay%20Yellow%20Lyrics.mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-02-14T20:03:19+00:00\",\"cover_image\":\"./assets/envelopes/14.avif\",\"background_image\":\"./assets/backgrounds/14-real.png\",\"polaroid_image\":\"./assets/polaroid-images/14.png\",\"song_name\":\"Yellow by Coldplay\",\"accent_color\":\"#413021\",\"text_color\":\"#FDFABE\",\"frosted_fill_color\":\"#413021\",\"volume\":1},{\"id\":\"15\",\"slug\":\"music\",\"title\":\"music\",\"author\":\"p\",\"recipient\":\"d\",\"body\":\"dear d,\\n\\nit's been years since we were close but i still dream about you. i hope one day i have the balls to ask you whether you liked me back in high school. you were so different when you were around me; so real. i will never meet someone as funny, brilliant and secretly caring as you were. i still remember fighting over maths sums with you (you were always right somehow) and walking back home together after school (that was the best part of my day). i think our paths will never cross again but you should know that i look for you in every person i meet.\\n\\ni hope you're doing well and one day i can tell you how much you meant to me (and my mom lol she absolutely loved you)\\n\\nlove, p\",\"audio_url\":\"./assets/love-songs/Love%20Dreams%20Lofi%20Beat.mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-02-15T14:29:14+00:00\",\"cover_image\":\"./assets/envelopes/15.avif\",\"background_image\":\"./assets/backgrounds/15-real.png\",\"polaroid_image\":\"./assets/polaroid-images/15.png\",\"song_name\":\"love dreams by Coderr\",\"accent_color\":\"#5E4E8A\",\"text_color\":\"#5E4E8A\",\"frosted_fill_color\":\"#FFEFFB\",\"volume\":1},{\"id\":\"16\",\"slug\":\"de-mi-para-mi\",\"title\":\"de mi para mi\",\"author\":\"Lici\",\"recipient\":\"Lici\",\"body\":\"$16\",\"audio_url\":\"./assets/love-songs/Happy%20I'm%20UMI%20Lyric%20Video.mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-02-15T18:05:45+00:00\",\"cover_image\":\"./assets/envelopes/16.avif\",\"background_image\":\"./assets/backgrounds/16-real.png\",\"polaroid_image\":\"./assets/polaroid-images/16.png\",\"song_name\":\"Happy I'm by UMI\",\"accent_color\":\"#2E5458\",\"text_color\":\"#2E5458\",\"frosted_fill_color\":\"#FFF9FC\",\"volume\":1},{\"id\":\"17\",\"slug\":\"l\",\"title\":\"L\",\"author\":\"A\",\"recipient\":\"L\",\"body\":\"Dear L,\\n\\nIt saddens me in Valentine's Day we're over before we even begin, before I know how it feels in my stomach when we touch.\\n\\nI wonder how you feel a lot. How you smell when we hug, whether your moustache tickles when we kiss.\\n\\nI'll miss when you call me love, before knowing what is even falling in love. You're strange, but a lovely person. I hope you know that. Thank you for making me smile in the middle of my day (timezone gap!). \\n\\nThis reminds me moment is short and the longest we'll ever get.\\n\\nLove,\\nA\",\"audio_url\":\"./assets/love-songs/Time%20Machine%20-%20MJ%20Apanay%20ft.%20Aren%20Park.mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-02-17T07:12:07+00:00\",\"cover_image\":\"./assets/envelopes/17.avif\",\"background_image\":\"./assets/backgrounds/17-real.png\",\"polaroid_image\":\"./assets/polaroid-images/17.png\",\"song_name\":\"time machine by mj apanay ft. aren park\",\"accent_color\":\"#000\",\"text_color\":\"#000\",\"frosted_fill_color\":\"#fff\",\"volume\":1},{\"id\":\"18\",\"slug\":\"dear-future-mother-in-law\",\"title\":\"dear future mother-in-law\",\"author\":\"your future daughter (in-law)\",\"recipient\":\"Future Mother-in-law\",\"body\":\"$17\",\"audio_url\":\"./assets/love-songs/Mitski%20-%20I%20Bet%20on%20Losing%20Dogs%20(Official%20Audio).mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-02-19T03:39:14+00:00\",\"cover_image\":\"./assets/envelopes/18.avif\",\"background_image\":\"./assets/backgrounds/18-real.png\",\"polaroid_image\":\"./assets/polaroid-images/18.png\",\"song_name\":\"I Bet on Losing Dogs by Mitski\",\"accent_color\":\"#CC789B\",\"text_color\":\"#CC789B\",\"frosted_fill_color\":\"#FFF9FC\",\"volume\":1},{\"id\":\"19\",\"slug\":\"riding-a-bike-in-copenhagen\",\"title\":\"riding a bike in copenhagen\",\"author\":\"V\",\"recipient\":\"N\",\"body\":\"Dear N,\\n\\nIt's been almost a month from our last day, even though I feel better I've found myself crying in the most random places: while reading in a cafe, the supermarket, even at a cycling class because it reminded me of Copenhagen. I'm a little afraid to ask you how are you for real, besides work, and the mundane I would like to know how are you feeling inside. I miss you, I miss the simple days with you, but I'm also feeling better little by little in this city I deeply love and we shared one day, and I'll keep that memory forever in me.\\n\\nYou're looking good, I hope you know it. \\n\\nwith love, \\n\\nV.\",\"audio_url\":\"./assets/love-songs/Ted%20Lucas%20-%2005.%20Baby%20Where%20You%20Are%20%20Ted%20Lucas.mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-03-06T18:50:16+00:00\",\"cover_image\":\"./assets/envelopes/19.avif\",\"background_image\":\"./assets/backgrounds/19-real.png\",\"polaroid_image\":\"./assets/polaroid-images/19.png\",\"song_name\":\"Baby Where You Are by Ted Lucase\",\"accent_color\":\"#413021\",\"text_color\":\"#FDFABE\",\"frosted_fill_color\":\"#413021\",\"volume\":1},{\"id\":\"20\",\"slug\":\"i-hope-you-re-doing-well\",\"title\":\"i hope you're doing well\",\"author\":\"K🍓\",\"recipient\":\"B\",\"body\":\"$18\",\"audio_url\":\"./assets/love-songs/Ed%20Sheeran%20-%20Lego%20House%20(Lyric%20Video).mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-06-02T10:56:45+00:00\",\"cover_image\":\"./assets/envelopes/20.avif\",\"background_image\":\"./assets/backgrounds/20-real.png\",\"polaroid_image\":\"./assets/polaroid-images/20.png\",\"song_name\":\"Lego House by Ed Sheeran\",\"accent_color\":\"#5FAAE0\",\"text_color\":\"#5FAAE0\",\"frosted_fill_color\":\"#FFF4FD\",\"volume\":1},{\"id\":\"21\",\"slug\":\"forever\",\"title\":\"forever\",\"author\":null,\"recipient\":null,\"body\":\"My Love,\\n\\nI’m scared to wake up in the morning that there will be no you anymore. I’m scared to hear a song that reminds me of you because I might just suddenly cry. I’m scared to think all the plans we have for our future will not go as we planned. I’m scared that you’ll just be a person I once loved wholeheartedly. I’m scared, truly. I don’t even know what to do or what to think, my mind will only be filled with emptiness. My heart will shatter, each pieces will be lost every time I thought of you. I could never love someone as much as I’ve loved you. All the things that reminded me of you will be just a memory stored in me, and I don’t ever want that to be just a memory waiting to be forgotten. \",\"audio_url\":\"./assets/love-songs/The%20Black%20Skirts%20-%20EVERYTHING.mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-06-16T07:35:26+00:00\",\"cover_image\":\"./assets/envelopes/21.avif\",\"background_image\":\"./assets/backgrounds/21-real.png\",\"polaroid_image\":\"./assets/polaroid-images/21.png\",\"song_name\":\"EVERYTHING by The Black Skirts\",\"accent_color\":\"#2D352A\",\"text_color\":\"#BFECE4\",\"frosted_fill_color\":\"#2D352A\",\"volume\":1},{\"id\":\"22\",\"slug\":\"thought-of-you-on-the-bus-home\",\"title\":\"thought of you on the bus home\",\"author\":\"S\",\"recipient\":\"S\",\"body\":\"dear S,\\n\\ni hope you're well i hope you always are. you're full of magic \u0026 sweetness \u0026 tenderness. we've never met \u0026 that's so crazy. just the thought of you makes me feel sweet. you're filled with so much love it can't help but pour out of you in everything you say. i don't think i can tell you any of this anymore. does it make sense to be so hopelessly in love with someone you've never met? i know you never felt it the way i did \u0026 i don't blame you for a thing, all i have for you is the love of the whole world. you make it look so easy to be simply \u0026 unwaveringly loving. that i feel the love inside me too still. \u0026 i know it'll never be reciprocated \u0026 i'm comfortable with that. you're someone i will never forget. you used to say the same but i don't think it worked out. i hope we never meet. i wouldn't know what to say anymore if we did.\\n\\nlove, S\\nfrom miles \u0026 miles away\",\"audio_url\":\"./assets/love-songs/Trees%20and%20Flowers.mp3\",\"thumbnail_url\":null,\"created_at\":\"2025-06-16T11:02:59+00:00\",\"cover_image\":\"./assets/envelopes/22.avif\",\"background_image\":\"./assets/backgrounds/22.png\",\"polaroid_image\":\"./assets/polaroid-images/22.png\",\"song_name\":\"Trees and Flowers by Strawberry Switch\",\"accent_color\":\"#BD9A00\",\"text_color\":\"#BD9A00\",\"frosted_fill_color\":\"#FFFBEA\",\"volume\":1},{\"id\":\"23\",\"slug\
